<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Morning Market Cards — {{TITLE_DATE}}</title>
<style>
  :root{
    --bg:#f3f4f6; --surface:#ffffff; --ink:#111827; --ink-2:#4b5563; --ink-3:#6b7280;
    --line:#e5e7eb; --track:#e5e7eb; --control-bg:#e5e7eb;
    --up:#16a34a; --dn:#dc2626; --shadow:0 1px 3px rgba(17,24,39,.08);
    --head-bg:#111827; --head-ink:#ffffff; --head-sub:#9ca3af;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0f14; --surface:#151b23; --ink:#f3f4f6; --ink-2:#cbd5e1; --ink-3:#94a3b8;
      --line:#26303c; --track:#26303c; --control-bg:#1f2937;
      --up:#4ade80; --dn:#f87171; --shadow:0 1px 3px rgba(0,0,0,.4);
      --head-bg:#030712; --head-ink:#f9fafb; --head-sub:#9ca3af;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    padding:16px; max-width:1200px; margin:0 auto;
    -webkit-text-size-adjust:100%;
  }
  header.top{
    background:var(--head-bg); color:var(--head-ink);
    border-radius:10px; padding:20px 22px; margin-bottom:14px;
  }
  header.top h1{font-size:22px; letter-spacing:-.01em; margin-bottom:4px}
  header.top p{color:var(--head-sub); font-size:13px; line-height:1.5}
  .legend{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:12px; font-size:12.5px; color:var(--head-ink)}
  .legend .item{display:inline-flex; align-items:center; gap:6px}
  .legend .dot{width:11px; height:11px; border-radius:50%; display:inline-block; flex:none}
  .controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
  .seg{display:flex; background:var(--control-bg); border-radius:999px; padding:3px}
  .seg button{
    border:0; background:transparent; padding:8px 18px; border-radius:999px;
    font-size:14px; cursor:pointer; color:var(--ink-2); font-family:inherit;
  }
  .seg button.active{background:var(--head-bg); color:#fff; font-weight:600}
  .seg button:focus-visible, .search:focus-visible{outline:2px solid #2563eb; outline-offset:2px}
  .search{
    margin-left:auto; padding:9px 14px; border:1px solid var(--line);
    border-radius:999px; font-size:14px; width:230px; max-width:100%;
    background:var(--surface); color:var(--ink); font-family:inherit;
  }
  .search::placeholder{color:var(--ink-3)}
  section.group{margin-bottom:22px}
  section.group > h2{
    font-size:14px; text-transform:uppercase; letter-spacing:.06em;
    margin-bottom:10px; display:flex; align-items:center; gap:8px; color:var(--ink);
  }
  .dot{width:11px; height:11px; border-radius:50%; display:inline-block; flex:none}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px}
  .card{
    background:var(--surface); border-radius:10px; padding:16px;
    border-left:5px solid #9ca3af; box-shadow:var(--shadow);
  }
  .row1{flex-wrap:wrap;display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:2px}
  .sym{font-size:17px; font-weight:700}
  .lbl{font-size:12px; color:var(--ink-3); margin-left:6px}
  .pricewrap{text-align:right; white-space:nowrap}
  .price{font-size:17px; font-weight:700}
  .chg{font-size:13px; font-weight:600; margin-left:6px}
  .up{color:var(--up)} .dn{color:var(--dn)}
  .pill{
    display:inline-block; font-size:12px; font-weight:700; color:#fff;
    border-radius:999px; padding:3px 10px; margin:8px 0;
  }
  .scores{display:flex; gap:14px; font-size:13px; margin-bottom:8px; color:var(--ink-2); flex-wrap:wrap}
  .scores b{font-size:14px; color:var(--ink)}
  .ev{font-size:13px; color:var(--ink-2); margin-bottom:8px; line-height:1.45}
  .sup{font-size:12.5px; color:var(--ink-2); margin-bottom:4px; line-height:1.4}
  .sup b{color:var(--ink)}
  .meta{font-size:12.5px; color:var(--ink-2); margin-top:6px; line-height:1.5}
  .meta .k{color:var(--ink-3)}
  footer{color:var(--ink-3); font-size:12px; text-align:center; margin:18px 0 8px; line-height:1.5}
  .empty{color:var(--ink-3); font-size:14px; padding:24px; text-align:center}
  @media (max-width:480px){
    body{padding:12px}
    .cards{grid-template-columns:1fr}
    .search{width:100%; margin-left:0}
    header.top h1{font-size:20px}
  }
  .statusline{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .badge{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--control-bg)}
  .warning{color:var(--dn);font-weight:600}
  details{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:12px;overflow-wrap:anywhere}
  summary{cursor:pointer;color:var(--ink-2);font-weight:600}
  summary:focus-visible{outline:2px solid #2563eb}
  .detailrow{margin-top:8px;line-height:1.5;color:var(--ink-2)}
  .detailrow pre{white-space:pre-wrap;font:inherit}
  .scores span{flex:1;min-width:80px}.scores small{display:block;font-size:10px}
.measurements{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:12px}.metrics{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}.metrics caption{text-align:left;color:var(--ink-3);margin-bottom:6px}.metrics th,.metrics td{text-align:left;padding:5px 3px;border-bottom:1px solid var(--line)}.preview summary{color:var(--ink);letter-spacing:.02em}
[hidden]{display:none!important}.page-tabs{display:flex;gap:8px;margin:18px 0}.page-tabs button{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:10px 16px;background:var(--surface);color:var(--ink);cursor:pointer}.page-tabs .active{background:var(--head-bg);color:var(--head-ink)}.brief-intro{color:var(--ink-2);font-size:14px;margin-bottom:18px}.brief-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.brief-section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}.brief-section h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--up);margin-bottom:14px}.brief-section h2 span{color:var(--ink-3);font-size:12px;margin-left:5px}.brief-row{display:flex;align-items:baseline;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}.brief-row:last-child{border:0}.brief-row span{flex:1}.symbol-link{font:inherit;font-weight:700;color:var(--up);background:none;border:0;padding:0;cursor:pointer;min-width:60px;text-align:left}.symbol-link:hover{text-decoration:underline}.muted{font-size:12px;color:var(--ink-3);line-height:1.6;margin:8px 0}.compact-scores{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin:12px 0}.compact-scores b{color:var(--ink);font-size:14px}.compact-summary{margin-bottom:6px;min-height:38px}.compact .card-details{margin-top:12px}.analysis-body{padding-top:16px}.data-exception{color:var(--dn)}button:focus-visible{outline:2px solid #2563eb;outline-offset:3px}@media(max-width:700px){.brief-grid{grid-template-columns:1fr;gap:0}.brief-section{padding:16px}.brief-row{font-size:13px}}
.watch-item{padding:14px 0;border-bottom:1px solid var(--line)}.watch-item:last-child{border-bottom:0}
</style>
</head>
<body>
<header class="top">
  <h1>Morning market briefing</h1>
  <p>{{ASOF_ET}}</p>
  <p>{{DATA_NOTES}}</p>
  <div class="legend" aria-label="Stage color legend">
    <span class="item"><span class="dot" style="background:#64748b"></span>Stage 1 &middot; Basing</span>
    <span class="item"><span class="dot" style="background:#16a34a"></span>Stage 2 &middot; Advancing</span>
    <span class="item"><span class="dot" style="background:#d97706"></span>Stage 3 &middot; Topping</span>
    <span class="item"><span class="dot" style="background:#dc2626"></span>Stage 4 &middot; Declining</span>
  </div>
</header>
<nav class="page-tabs" aria-label="Dashboard view"><button id="btnBrief" type="button" class="active" aria-pressed="true">Daily briefing</button><button id="btnCards" type="button" aria-pressed="false">All tickers</button></nav>
<div id="briefing"></div>
<div id="cardControls" class="controls">
  <div class="seg" role="group" aria-label="Group cards by">
    <button id="btnStage" type="button" class="active" aria-pressed="true">Stage</button>
    <button id="btnCat" type="button" aria-pressed="false">Category</button>
  </div>
  <input id="q" class="search" type="text" inputmode="search" placeholder="Filter by symbol or name&hellip;" aria-label="Filter by symbol or name" />
</div>
<div id="board"></div>
<footer>{{FOOTER_HTML}}</footer>
<script>
var CARDS = {{CARDS_JSON}};
var DAILY_BRIEFING = {{BRIEFING_JSON}};
var MARKET_CONTEXT = {{MARKET_CONTEXT_JSON}};
var pageView = "briefing";
var COLORS = {
  "Stage 1": "#64748b",
  "Stage 2": "#16a34a",
  "Stage 3": "#d97706",
  "Stage 4": "#dc2626",
  "Stage 1 → 2": "#16a34a",
  "Stage 2 → 3": "#d97706",
  "Stage 3 → 4": "#dc2626"
};
var STAGE_ORDER = ["Stage 1 → 2", "Stage 2 → 3", "Stage 3 → 4", "Stage 1", "Stage 2", "Stage 3", "Stage 4"];
var STAGE_NAMES = {
  "Stage 1": "Stage 1 · Basing",
  "Stage 2": "Stage 2 · Advancing",
  "Stage 3": "Stage 3 · Topping",
  "Stage 4": "Stage 4 · Declining",
  "Stage 1 → 2": "Stage 1 → 2 · Breakout",
  "Stage 2 → 3": "Stage 2 → 3 · Caution",
  "Stage 3 → 4": "Stage 3 → 4 · Breakdown"
};
var CAT_ORDER = ["Market", "Crypto", "Mag 7", "Growth", "Metals"];
var view = "stage";

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function present(v){ return v == null || v === "" ? "n/a" : esc(v); }
function timeET(v){
  if (!v) return "Unavailable";
  var d = new Date(v);
  return isNaN(d.getTime()) ? esc(v) : esc(d.toLocaleString("en-US", {timeZone:"America/New_York",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"}));
}
function detailHTML(label, block){
  if (!block) return "";
  var text = block.reason || block.evidence;
  var meta = [block.rule_id, block.rule_version, block.provenance].filter(Boolean).map(esc).join(" · ");
  return '<div class="detailrow"><b>' + esc(label) + '</b> ' + meta
    + (text ? '<div>' + esc(text) + '</div>' : '')
    + (block.inputs ? '<pre>' + esc(JSON.stringify(block.inputs, null, 2)) + '</pre>' : '') + '</div>';
}
function metric(v, unit){return typeof v === "number" && Number.isFinite(v) ? esc(v.toFixed(2))+(unit || "") : "n/a";}
function proposedHTML(c){
  var p=c.proposed_extensions;
  if(!p) return "";
  var rs=p.relative_strength || {}, vol=p.volatility || {}, ex=p.extension || {};
  var cutoff=(p.data_separation || {}).confirmed_bars_cutoff || vol.analytical_cutoff;
  var rows=Object.keys(rs.periods || {}).map(function(k){
    var r=rs.periods[k] || {}, spy=r.vs_spy || {}, sector=r.vs_sector || {};
    return '<tr><td>'+present(k)+'</td><td>'+metric(spy.relative_pp,' pp')+'</td><td>'+present(sector.benchmark)+' '+metric(sector.relative_pp,' pp')+'</td></tr>';
  }).join('');
  var out='<div class="measurements"><b>Proposed measurements</b><div class="meta">Completed-bar cutoff: '+present(cutoff)+' · Separate from native snapshot above</div>';
  out+='<div class="meta">ATR(14): '+metric(vol.atr_14)+' · '+metric(vol.atr_14_pct,'%')+' of analytical price</div>';
  ['21','50'].forEach(function(n){var e=ex['vs_ema'+n] || {};out+='<div class="meta">Distance from EMA '+n+': '+metric(e.pct,'%')+' · '+metric(e.atr_multiples,' ATR')+'</div>';});
  out+= rows ? '<table class="metrics"><caption>Relative performance · percentage points</caption><thead><tr><th>Sessions</th><th>vs SPY</th><th>vs sector</th></tr></thead><tbody>'+rows+'</tbody></table>' : '<div class="meta">Relative performance: '+present(rs.reason || rs.availability)+'</div>';
  out+='</div>';
  var setups=((p.setup_detail || {}).setups || []).filter(Boolean);
  out+='<details class="preview"><summary>PREVIEW · Setups and exit candidates</summary><div class="meta">Unvalidated proposed rules · not in production</div>';
  if(!setups.length) out+='<div class="meta">No proposed setup available.</div>';
  setups.forEach(function(x){
    out+='<div class="detailrow"><b>'+present(x.setup_type)+'</b> · '+present((x.state || x.status || '').replace(/_/g,' '))+'<div>Trigger: '+metric(x.trigger_level == null ? x.breakout_level : x.trigger_level)+' · Invalidation: '+metric(x.invalidation_level)+'</div><div>Formation: '+present(x.formation_date)+' · Trigger date: '+present(x.trigger_date)+'</div><div>Trailing candidate: '+metric(x.trailing_level)+'</div>';
    if(x.risk_distance) out+='<div>Trigger-to-invalidation distance: '+metric(x.risk_distance.dollars)+' · '+metric(x.risk_distance.percent,'%')+' · '+metric(x.risk_distance.atr_multiples,' ATR')+'</div>';
    if(x.orderly_tier) out+='<div>Pullback tier: '+present(x.orderly_tier)+' · Volume confirmation: '+present(x.volume_confirmation)+'</div>';
    out+='</div>';
  });
  out+='</details>';
  return out;
}
function trendLabel(v){return {Focus:'Favorable',Caution:'Mixed',Ignore:'Weak'}[v] || 'Not classified';}
function dataException(c){
  var q=c.data_quality || {}, note=c.dataNote;
  if(note && /^\s*Source\s*:/i.test(note))note='';
  if(q.status === 'stale' || q.status === 'degraded')return note || q.details || 'Some data is '+q.status;
  return note || '';
}
function fullCardHTML(c){
  var sups=(c.supports || []).map(function(x){return '<div class="sup"><b>'+present(x.level)+'</b> · support rating '+present(x.rating)+'/10</div>';}).join('');
  var dq=c.data_quality || {}, cutoff=dq.analytical_cutoff;
  var note=dataException(c);
  return '<article><div class="meta"><b>Pullback:</b> '+present(c.pullbackStatus)+'</div>'
    +'<div class="meta"><b>Trend assessment:</b> '+trendLabel(c.riskDial)+'</div>'
    +(c.stageEvidence?'<div class="meta">'+esc(c.stageEvidence)+'</div>':'')
    +(cutoff?'<div class="meta">Native analytical cutoff: '+present(cutoff)+'</div>':'')
    +(note?'<div class="meta data-exception">'+esc(note)+'</div>':'')
    +'<div class="meta"><b>Support levels</b></div>'+(sups || '<div class="meta">Not provided</div>')
    +'<div class="meta"><b>Buy zone:</b> '+present(c.buyZone)+'</div>'
    +'<div class="meta"><b>Invalidation:</b> '+present(c.invalidation)+'</div>'
    +'<div class="meta"><b>Watch:</b> '+present(c.catalyst)+'</div>'
    +emaDetailHTML(c)+proposedHTML(c)+'</article>';
}
function shortText(v){
  if(!v) return "Summary unavailable";
  var text=String(v); return esc(text.length > 150 ? text.slice(0,147)+'…' : text);
}
function emaPositionHTML(c){
  var p=c.ema_analysis;
  if(!p || p === 'unavailable' || p.availability === 'unavailable') return '<div class="meta">Completed-bar EMA position: unavailable</div>';
  var rows=['9','21','50'].map(function(n){
    var e=p['ema_'+n];
    if(!e || e === 'unavailable')return n+': unavailable';
    return n+': '+present(e.position)+' · '+present(e.slope_direction);
  });
  var crossings=['9','21','50'].filter(function(n){var e=p['ema_'+n];return e && ['bullish','bearish'].indexOf(e.crossing)>=0;}).map(function(n){return 'EMA '+n+' '+present(p['ema_'+n].crossing)+' crossing';});
  return '<div class="meta">Completed-bar EMAs · '+present(p.analytical_cutoff)+'</div><div class="meta">'+rows.join('<br>')+'</div>'+(crossings.length?'<div class="meta">'+crossings.join(' · ')+' · vs '+present(p.previous_cutoff)+'</div>':'');
}
function emaDetailHTML(c){
  var p=c.ema_analysis;
  if(!p || p === 'unavailable')return '';
  var rows=['9','21','50'].map(function(n){var e=p['ema_'+n];if(!e || e === 'unavailable')return '';return '<tr><td>'+n+'</td><td>'+metric(e.value)+'</td><td>'+present(e.position)+'</td><td>'+metric(e.slope_5bar_pct,'%')+' '+present(e.slope_direction)+'</td></tr>';}).join('');
  return '<div class="measurements"><b>Daily EMAs</b><div class="meta">As of '+present(p.analytical_cutoff)+'</div><table class="metrics"><thead><tr><th>EMA</th><th>Value</th><th>Price</th><th>5-bar change</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function comparisonValue(v){
  if(v == null || v === 'unavailable')return 'unavailable';
  return esc(typeof v === 'object'?JSON.stringify(v):v);
}
function changeLines(obj,prefix){
  if(!obj || typeof obj !== 'object')return [];
  var out=[];
  Object.keys(obj).forEach(function(k){
    if(['symbol','label','status','summary','has_changes','availability'].indexOf(k)>=0)return;
    var v=obj[k],name=(prefix?prefix+' · ':'')+k;
    if(k === 'riskDial' && v && typeof v === 'object' && ('from' in v || 'to' in v)){out.push('Trend: '+(v.from === 'unavailable' ? 'unavailable' : trendLabel(v.from))+' → '+(v.to === 'unavailable' ? 'unavailable' : trendLabel(v.to)));return;}
    if(v === 'unavailable')out.push(esc(name)+': comparison unavailable');
    else if(v && typeof v === 'object' && ('from' in v || 'to' in v))out.push(esc(name)+': '+comparisonValue(v.from)+' → '+comparisonValue(v.to));
    else if(v && typeof v === 'object')out=out.concat(changeLines(v,name));
  });
  return out;
}
function cardHTML(c){
  var col=COLORS[c.stage] || '#64748b';
  var ch=typeof c.changePercent === 'number' && Number.isFinite(c.changePercent) ? '<span class="chg '+(c.changePercent>=0?'up':'dn')+'">'+(c.changePercent>0?'+':'')+c.changePercent.toFixed(1)+'%</span>' : '<span class="chg">n/a</span>';
  var quality=(c.data_quality || {}).status;
  var exception=dataException(c);
  var body=fullCardHTML(c).replace(/^<article[^>]*>/,'').replace(/<\/article>$/,'');
  return '<article class="card compact" style="border-left-color:'+col+'"><div class="row1"><div><span class="sym">'+present(c.symbol)+'</span><span class="lbl">'+present(c.label)+'</span></div><div class="pricewrap"><span class="price">'+present(c.priceDisplay)+'</span>'+ch+'</div></div>'
    +'<div class="statusline"><span class="badge">'+present(c.stage)+'</span><span class="badge">Trend: '+trendLabel(c.riskDial)+'</span></div>'
    +'<div class="compact-scores"><span>Short <b>'+present(c.dailyScore)+'</b></span><span>Intermediate <b>'+present(c.weeklyScore)+'</b></span><span>Long <b>'+present(c.monthlyScore)+'</b></span><small>/10</small></div>'
    +'<p class="ev compact-summary">'+shortText(c.stageEvidence || c.pullbackStatus)+'</p>'
    +emaPositionHTML(c)
    +(exception ? '<div class="meta data-exception">'+esc(exception)+'</div>' : '')
    +'<details class="card-details"><summary>Open full analysis</summary><div class="analysis-body">'+body+'</div></details></article>';
}
function briefingRows(cards, reason){
  return cards.map(function(c){return '<div class="brief-row"><button class="symbol-link" type="button" data-symbol="'+esc(c.symbol)+'">'+present(c.symbol)+'</button><span>'+shortText(reason(c))+'</span></div>';}).join('');
}
function trendWatch(c){
  var p=c.ema_analysis;
  if(!p || p === 'unavailable')return c.stageEvidence || 'Trend conditions not provided';
  return ['21','50'].map(function(n){var e=p['ema_'+n];return e && e !== 'unavailable' ? 'EMA '+n+': price '+e.position+', average '+e.slope_direction : 'EMA '+n+': unavailable';}).join(' · ');
}
function watchRows(cards){
  return cards.map(function(c){
    return '<div class="watch-item"><button class="symbol-link" type="button" data-symbol="'+esc(c.symbol)+'">'+present(c.symbol)+'</button> <span class="muted">'+present(c.pullbackStatus)+' · Trend: '+trendLabel(c.riskDial)+'</span>'
      +'<div class="meta"><b>Confirmation to watch:</b> '+present(c.catalyst || 'No confirmation condition supplied')+'</div>'
      +'<div class="meta"><b>Invalidation:</b> '+present(c.invalidation)+'</div>'
      +'<div class="meta"><b>Trend to monitor:</b> '+esc(trendWatch(c))+'</div></div>';
  }).join('');
}
function marketContextHTML(){
  var m=MARKET_CONTEXT;
  if(!m || !m.summary)return '';
  return '<section class="brief-section"><h2>Market context</h2><p class="meta">'+esc(m.summary)+'</p>'+(m.analytical_cutoff?'<p class="muted">As of '+present(m.analytical_cutoff)+'</p>':'')+'</section>';
}
function briefingSection(title,cards,reason,empty){
  var watch=title === 'Setups on watch',limit=watch?3:5;
  return '<section class="brief-section"'+(watch?' style="grid-column:1/-1"':'')+'><h2>'+esc(title)+' <span>'+cards.length+'</span></h2>'+(cards.length?(watch?watchRows(cards.slice(0,limit)):briefingRows(cards.slice(0,limit),reason)):'<p class="muted">'+esc(empty)+'</p>')+(cards.length>limit?'<p class="muted">Showing '+limit+' of '+cards.length+' · browse All tickers for the rest.</p>':'')+'</section>';
}
function renderBriefing(){
  var watch=CARDS.filter(function(c){return c.pullbackStatus === 'Healthy pullback' || c.stage === 'Stage 1 → 2';});
  var focus=CARDS.filter(function(c){return c.riskDial === 'Focus';});
  var caution=CARDS.filter(function(c){return c.riskDial === 'Caution' || c.riskDial === 'Ignore';});
  var issues=CARDS.filter(function(c){return !!dataException(c);});
  var absent=CARDS.filter(function(c){return !(c.data_quality || {}).status;}).length;
  var previews=CARDS.filter(function(c){return (((c.proposed_extensions || {}).setup_detail || {}).setups || []).some(function(x){return x && x.state === 'triggered';});});
  document.getElementById('briefing').innerHTML='<div class="brief-intro"><p>A daily snapshot of '+CARDS.length+' tickers. Open a symbol for the full analysis.</p></div>'+marketContextHTML()+'<div class="brief-grid">'
    +briefingSection('Setups on watch',watch,function(c){return c.pullbackStatus+' · '+(c.catalyst || c.stageEvidence || '');},'No healthy pullbacks or Stage 1 → 2 transitions reported.')
    +briefingSection('Worth watching',focus,function(c){return 'Trend: '+trendLabel(c.riskDial)+' · '+(c.stageEvidence || '');},'No favorable trend assessments reported.')
    +briefingSection('Needs review',caution,function(c){return 'Trend: '+trendLabel(c.riskDial)+' · '+(c.pullbackStatus || c.stageEvidence || '');},'No mixed or weak trend assessments reported.')
    +briefingSection('Data exceptions',issues,function(c){return dataException(c);},'No explicit data exceptions supplied.')+'</div>'
    +(previews.length?briefingSection('PREVIEW · Triggered setups',previews,function(c){return 'Proposed, unvalidated setup · open full analysis for its cutoff and trigger date.';},''):'')
    +'<p class="muted">Watch sections describe this snapshot, not changes since yesterday. Order follows the dataset.</p>';
  document.getElementById('briefing').querySelectorAll('[data-symbol]').forEach(function(b){b.addEventListener('click',function(){openSymbol(b.getAttribute('data-symbol'));});});
}
function setPage(v){
  pageView=v;
  ['Brief','Cards'].forEach(function(n){var active=(n==='Brief') === (v==='briefing');var b=document.getElementById('btn'+n);b.className=active?'active':'';b.setAttribute('aria-pressed',String(active));});
  document.getElementById('briefing').hidden=v!=='briefing';
  document.getElementById('cardControls').hidden=v!=='cards';
  document.getElementById('board').hidden=v!=='cards';
  if(v==='briefing')renderBriefing();else render();
}
function openSymbol(symbol){
  document.getElementById('q').value=symbol;setPage('cards');
  var panel=document.getElementById('board').querySelector('.card-details');
  if(panel){panel.open=true;panel.querySelector('summary').focus();panel.scrollIntoView({block:'nearest',behavior:'smooth'});}
}
function setView(v){
  view = v;
  var bs = document.getElementById("btnStage");
  var bc = document.getElementById("btnCat");
  bs.className = v === "stage" ? "active" : "";
  bc.className = v === "cat" ? "active" : "";
  bs.setAttribute("aria-pressed", v === "stage" ? "true" : "false");
  bc.setAttribute("aria-pressed", v === "cat" ? "true" : "false");
  render();
}
function render(){
  var q = document.getElementById("q").value.trim().toLowerCase();
  var list = CARDS.filter(function(c){
    return !q || String(c.symbol || "").toLowerCase().indexOf(q) >= 0 || String(c.label || "").toLowerCase().indexOf(q) >= 0;
  });
  var board = document.getElementById("board");
  if (!list.length){
    board.innerHTML = '<div class="empty">No cards match that filter.</div>';
    return;
  }
  var out = "";
  if (view === "stage"){
    STAGE_ORDER.forEach(function(st){
      var g = list.filter(function(c){ return c.stage === st; });
      if (!g.length) return;
      out += '<section class="group"><h2><span class="dot" style="background:' + (COLORS[st] || "#9ca3af") + '"></span>' + esc(STAGE_NAMES[st] || st) + ' (' + g.length + ')</h2><div class="cards">'
        + g.map(cardHTML).join("") + "</div></section>";
    });
    var other = list.filter(function(c){ return STAGE_ORDER.indexOf(c.stage) < 0; });
    if (other.length) out += '<section class="group"><h2>Other (' + other.length + ')</h2><div class="cards">' + other.map(cardHTML).join("") + "</div></section>";
  } else {
    CAT_ORDER.concat(list.map(function(c){return c.category;}).filter(function(cat,i,a){return CAT_ORDER.indexOf(cat)<0 && a.indexOf(cat)===i;})).forEach(function(cat){
      var g = list.filter(function(c){ return c.category === cat; });
      if (!g.length) return;
      out += '<section class="group"><h2>' + esc(cat) + ' (' + g.length + ')</h2><div class="cards">'
        + g.map(cardHTML).join("") + "</div></section>";
    });
  }
  board.innerHTML = out;
}
document.getElementById("btnStage").addEventListener("click", function(){ setView("stage"); });
document.getElementById("btnCat").addEventListener("click", function(){ setView("cat"); });
document.getElementById("q").addEventListener("input", render);
document.getElementById('btnBrief').addEventListener('click',function(){setPage('briefing');});
document.getElementById('btnCards').addEventListener('click',function(){document.getElementById('q').value='';setPage('cards');});
setPage('briefing');
</script>
</body>
</html>
