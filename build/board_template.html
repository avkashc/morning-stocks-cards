<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Morning Market Cards — {{TITLE_DATE}}</title>
<style>
  :root{
    --bg:#f3f4f6; --surface:#ffffff; --ink:#111827; --ink-2:#4b5563; --ink-3:#6b7280;
    --line:#e5e7eb; --track:#e5e7eb; --control-bg:#e5e7eb;
    --up:#16a34a; --dn:#dc2626; --shadow:0 1px 3px rgba(17,24,39,.08);
    --head-bg:#111827; --head-ink:#ffffff; --head-sub:#9ca3af;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0f14; --surface:#151b23; --ink:#f3f4f6; --ink-2:#cbd5e1; --ink-3:#94a3b8;
      --line:#26303c; --track:#26303c; --control-bg:#1f2937;
      --up:#4ade80; --dn:#f87171; --shadow:0 1px 3px rgba(0,0,0,.4);
      --head-bg:#030712; --head-ink:#f9fafb; --head-sub:#9ca3af;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    padding:16px; max-width:1200px; margin:0 auto;
    -webkit-text-size-adjust:100%;
  }
  header.top{
    background:var(--head-bg); color:var(--head-ink);
    border-radius:10px; padding:20px 22px; margin-bottom:14px;
  }
  header.top h1{font-size:22px; letter-spacing:-.01em; margin-bottom:4px}
  header.top p{color:var(--head-sub); font-size:13px; line-height:1.5}
  .legend{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:12px; font-size:12.5px; color:var(--head-ink)}
  .legend .item{display:inline-flex; align-items:center; gap:6px}
  .legend .dot{width:11px; height:11px; border-radius:50%; display:inline-block; flex:none}
  .controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
  .seg{display:flex; background:var(--control-bg); border-radius:999px; padding:3px}
  .seg button{
    border:0; background:transparent; padding:8px 18px; border-radius:999px;
    font-size:14px; cursor:pointer; color:var(--ink-2); font-family:inherit;
  }
  .seg button.active{background:var(--head-bg); color:#fff; font-weight:600}
  .seg button:focus-visible, .search:focus-visible{outline:2px solid #2563eb; outline-offset:2px}
  .search{
    margin-left:auto; padding:9px 14px; border:1px solid var(--line);
    border-radius:999px; font-size:14px; width:230px; max-width:100%;
    background:var(--surface); color:var(--ink); font-family:inherit;
  }
  .search::placeholder{color:var(--ink-3)}
  section.group{margin-bottom:22px}
  section.group > h2{
    font-size:14px; text-transform:uppercase; letter-spacing:.06em;
    margin-bottom:10px; display:flex; align-items:center; gap:8px; color:var(--ink);
  }
  .dot{width:11px; height:11px; border-radius:50%; display:inline-block; flex:none}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px}
  .card{
    background:var(--surface); border-radius:10px; padding:16px;
    border-left:5px solid #9ca3af; box-shadow:var(--shadow);
  }
  .row1{flex-wrap:wrap;display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:2px}
  .sym{font-size:17px; font-weight:700}
  .lbl{font-size:12px; color:var(--ink-3); margin-left:6px}
  .pricewrap{text-align:right; white-space:nowrap}
  .price{font-size:17px; font-weight:700}
  .chg{font-size:13px; font-weight:600; margin-left:6px}
  .up{color:var(--up)} .dn{color:var(--dn)}
  .pill{
    display:inline-block; font-size:12px; font-weight:700; color:#fff;
    border-radius:999px; padding:3px 10px; margin:8px 0;
  }
  .scores{display:flex; gap:14px; font-size:13px; margin-bottom:8px; color:var(--ink-2); flex-wrap:wrap}
  .scores b{font-size:14px; color:var(--ink)}
  .ev{font-size:13px; color:var(--ink-2); margin-bottom:8px; line-height:1.45}
  .sup{font-size:12.5px; color:var(--ink-2); margin-bottom:4px; line-height:1.4}
  .sup b{color:var(--ink)}
  .meta{font-size:12.5px; color:var(--ink-2); margin-top:6px; line-height:1.5}
  .meta .k{color:var(--ink-3)}
  footer{color:var(--ink-3); font-size:12px; text-align:center; margin:18px 0 8px; line-height:1.5}
  .empty{color:var(--ink-3); font-size:14px; padding:24px; text-align:center}
  @media (max-width:480px){
    body{padding:12px}
    .cards{grid-template-columns:1fr}
    .search{width:100%; margin-left:0}
    header.top h1{font-size:20px}
  }
  .statusline{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .badge{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--control-bg)}
  .warning{color:var(--dn);font-weight:600}
  details{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:12px;overflow-wrap:anywhere}
  summary{cursor:pointer;color:var(--ink-2);font-weight:600}
  summary:focus-visible{outline:2px solid #2563eb}
  .detailrow{margin-top:8px;line-height:1.5;color:var(--ink-2)}
  .detailrow pre{white-space:pre-wrap;font:inherit}
  .scores span{flex:1;min-width:80px}.scores small{display:block;font-size:10px}
</style>
</head>
<body>
<header class="top">
  <h1>Market trend cards</h1>
  <p>{{ASOF_ET}}</p>
  <p>{{DATA_NOTES}}</p>
  <div class="legend" aria-label="Stage color legend">
    <span class="item"><span class="dot" style="background:#64748b"></span>Stage 1 &middot; Basing</span>
    <span class="item"><span class="dot" style="background:#16a34a"></span>Stage 2 &middot; Advancing</span>
    <span class="item"><span class="dot" style="background:#d97706"></span>Stage 3 &middot; Topping</span>
    <span class="item"><span class="dot" style="background:#dc2626"></span>Stage 4 &middot; Declining</span>
  </div>
</header>
<div class="controls">
  <div class="seg" role="group" aria-label="Group cards by">
    <button id="btnStage" type="button" class="active" aria-pressed="true">Stage</button>
    <button id="btnCat" type="button" aria-pressed="false">Category</button>
  </div>
  <input id="q" class="search" type="text" inputmode="search" placeholder="Filter by symbol or name&hellip;" aria-label="Filter by symbol or name" />
</div>
<div id="board"></div>
<footer>{{FOOTER_HTML}}</footer>
<script>
var CARDS = {{CARDS_JSON}};
var COLORS = {
  "Stage 1": "#64748b",
  "Stage 2": "#16a34a",
  "Stage 3": "#d97706",
  "Stage 4": "#dc2626",
  "Stage 1 → 2": "#16a34a",
  "Stage 2 → 3": "#d97706",
  "Stage 3 → 4": "#dc2626"
};
var STAGE_ORDER = ["Stage 1 → 2", "Stage 2 → 3", "Stage 3 → 4", "Stage 1", "Stage 2", "Stage 3", "Stage 4"];
var STAGE_NAMES = {
  "Stage 1": "Stage 1 · Basing",
  "Stage 2": "Stage 2 · Advancing",
  "Stage 3": "Stage 3 · Topping",
  "Stage 4": "Stage 4 · Declining",
  "Stage 1 → 2": "Stage 1 → 2 · Breakout",
  "Stage 2 → 3": "Stage 2 → 3 · Caution",
  "Stage 3 → 4": "Stage 3 → 4 · Breakdown"
};
var CAT_ORDER = ["Market", "Crypto", "Mag 7", "Growth", "Metals"];
var view = "stage";

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function present(v){ return v == null || v === "" ? "n/a" : esc(v); }
function timeET(v){
  if (!v) return "Unavailable";
  var d = new Date(v);
  return isNaN(d.getTime()) ? esc(v) : esc(d.toLocaleString("en-US", {timeZone:"America/New_York",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"}));
}
function detailHTML(label, block){
  if (!block) return "";
  var text = block.reason || block.evidence;
  var meta = [block.rule_id, block.rule_version, block.provenance].filter(Boolean).map(esc).join(" · ");
  return '<div class="detailrow"><b>' + esc(label) + '</b> ' + meta
    + (text ? '<div>' + esc(text) + '</div>' : '')
    + (block.inputs ? '<pre>' + esc(JSON.stringify(block.inputs, null, 2)) + '</pre>' : '') + '</div>';
}
function cardHTML(c){
  var col = COLORS[c.stage] || "#64748b";
  var validChange = typeof c.changePercent === "number" && Number.isFinite(c.changePercent);
  var chg = validChange ? '<span class="chg '+(c.changePercent >= 0 ? "up" : "dn")+'">'+(c.changePercent > 0 ? "+" : "")+c.changePercent.toFixed(1)+'%</span>' : '<span class="chg">n/a</span>';
  var dq = c.data_quality || {};
  var quality = dq.status || "Unavailable";
  var scores = [["Short-term","daily",5,20],["Intermediate","weekly",20,60],["Long-term","monthly",60,150]].map(function(h){
    var block = (c.score_breakdown || {})[h[1]];
    var windows = block && block.windows || [h[2],h[3]];
    return '<span>'+h[0]+' <b>'+present(c[h[1]+"Score"])+'</b><small>'+esc(windows.join(" / "))+' daily bars · /10</small></span>';
  }).join("");
  var sups = (c.supports || []).map(function(s){return '<div class="sup"><b>'+present(s.level)+'</b> '+present(s.rating)+'/10</div>';}).join("");
  var details = detailHTML("Data",dq)+detailHTML("Stage",c.stage_detail)+detailHTML("Pullback",c.pullback_detail)+detailHTML("Risk",c.risk_detail);
  Object.keys(c.score_breakdown || {}).forEach(function(h){
    var block = c.score_breakdown[h];
    details += detailHTML(h+' trend',block);
    if (block.components) details += '<div class="detailrow"><pre>'+esc(JSON.stringify(block.components,null,2))+'</pre></div>';
    else details += '<div class="detailrow">Component trace unavailable.</div>';
  });
  if(c.emas) details += '<div class="detailrow"><b>Moving averages</b><pre>'+esc(JSON.stringify(c.emas,null,2))+'</pre></div>';
  return '<article class="card" style="border-left-color:'+col+'">'
    + '<div class="row1"><div><span class="sym">'+present(c.symbol)+'</span><span class="lbl">'+present(c.label)+'</span><span class="lbl"> · '+present(c.category)+'</span></div><div class="pricewrap"><span class="price">'+present(c.priceDisplay)+'</span>'+chg+'</div></div>'
    + '<span class="pill" style="background:'+col+'">'+present(c.stage)+'</span>'
    + '<div class="scores">'+scores+'</div>'
    + '<div class="statusline"><span class="badge">Risk: '+present(c.riskDial)+'</span><span class="badge">'+present(c.pullbackStatus)+'</span><span class="badge '+(quality === "degraded" || quality === "stale" ? "warning" : "")+'">Data: '+esc(quality)+'</span></div>'
    + '<div class="ev">'+present(c.stageEvidence)+'</div>'
    + (c.symbol === "TOTAL CRYPTO" ? '<div class="meta">Total market cap quote · BTC + ETH market-cap trend proxy · non-tradable</div>' : '')
    + '<div class="meta">Quote captured: '+timeET(dq.quote_timestamp)+'</div>'
    + '<div class="meta">Analytical cutoff: '+present(dq.analytical_cutoff)+'</div>'
    + (dq.cutoff_note ? '<div class="meta">'+esc(dq.cutoff_note)+'</div>' : '')
    + '<div class="meta"><span class="k">Supports:</span></div>'+(sups || '<div class="sup">n/a</div>')
    + '<div class="meta"><span class="k">Buy zone:</span> '+present(c.buyZone)+'</div>'
    + '<div class="meta"><span class="k">Invalidation:</span> '+present(c.invalidation)+'</div>'
    + '<div class="meta"><span class="k">Catalyst:</span> '+present(c.catalyst)+'</div>'
    + (c.dataNote ? '<div class="meta">'+esc(c.dataNote)+'</div>' : '')
    + (details ? '<details><summary>Why this classification? · Data and calculations</summary>'+details+'</details>' : '')+'</article>';
}
function setView(v){
  view = v;
  var bs = document.getElementById("btnStage");
  var bc = document.getElementById("btnCat");
  bs.className = v === "stage" ? "active" : "";
  bc.className = v === "cat" ? "active" : "";
  bs.setAttribute("aria-pressed", v === "stage" ? "true" : "false");
  bc.setAttribute("aria-pressed", v === "cat" ? "true" : "false");
  render();
}
function render(){
  var q = document.getElementById("q").value.trim().toLowerCase();
  var list = CARDS.filter(function(c){
    return !q || String(c.symbol || "").toLowerCase().indexOf(q) >= 0 || String(c.label || "").toLowerCase().indexOf(q) >= 0;
  });
  var board = document.getElementById("board");
  if (!list.length){
    board.innerHTML = '<div class="empty">No cards match that filter.</div>';
    return;
  }
  var out = "";
  if (view === "stage"){
    STAGE_ORDER.forEach(function(st){
      var g = list.filter(function(c){ return c.stage === st; });
      if (!g.length) return;
      out += '<section class="group"><h2><span class="dot" style="background:' + (COLORS[st] || "#9ca3af") + '"></span>' + esc(STAGE_NAMES[st] || st) + ' (' + g.length + ')</h2><div class="cards">'
        + g.map(cardHTML).join("") + "</div></section>";
    });
    var other = list.filter(function(c){ return STAGE_ORDER.indexOf(c.stage) < 0; });
    if (other.length) out += '<section class="group"><h2>Other (' + other.length + ')</h2><div class="cards">' + other.map(cardHTML).join("") + "</div></section>";
  } else {
    CAT_ORDER.concat(list.map(function(c){return c.category;}).filter(function(cat,i,a){return CAT_ORDER.indexOf(cat)<0 && a.indexOf(cat)===i;})).forEach(function(cat){
      var g = list.filter(function(c){ return c.category === cat; });
      if (!g.length) return;
      out += '<section class="group"><h2>' + esc(cat) + ' (' + g.length + ')</h2><div class="cards">'
        + g.map(cardHTML).join("") + "</div></section>";
    });
  }
  board.innerHTML = out;
}
document.getElementById("btnStage").addEventListener("click", function(){ setView("stage"); });
document.getElementById("btnCat").addEventListener("click", function(){ setView("cat"); });
document.getElementById("q").addEventListener("input", render);
render();
</script>
</body>
</html>
