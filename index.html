    -webkit-text-size-adjust:100%;

  header.top{

  header.top h1{font-size:22px; letter-spacing:-.01em; margin-bottom:4px}
  header.top p{color:var(--head-sub); font-size:13px; line-height:1.5}

  .legend .dot{width:11px; height:11px; border-radius:50%; display:inline-block; flex:none}
  .controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
  .seg{display:flex; background:var(--control-bg); border-radius:999px; padding:3px}
  .seg button{
    border:0; background:transparent; padding:8px 18px; border-radius:999px;

  .search{
    margin-left:auto; padding:9px 14px; border:1px solid var(--line);
    border-radius:999px; font-size:14px; width:230px; max-width:100%;
    background:var(--surface); color:var(--ink); font-family:inherit;

  .search::placeholder{color:var(--ink-3)}
  section.group{margin-bottom:22px}
  section.group > h2{
    font-size:14px; text-transform:uppercase; letter-spacing:.06em;
    margin-bottom:10px; display:flex; align-items:center; gap:8px; color:var(--ink);

  .dot{width:11px; height:11px; border-radius:50%; display:inline-block; flex:none}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px}
  .card{
    background:var(--surface); border-radius:10px; padding:16px;
    border-left:5px solid #9ca3af; box-shadow:var(--shadow);

  .row1{flex-wrap:wrap;display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:2px}

  .chg{font-size:13px; font-weight:600; margin-left:6px}
  .up{color:var(--up)} .dn{color:var(--dn)}
  .pill{
    display:inline-block; font-size:12px; font-weight:700; color:#fff;
    border-radius:999px; padding:3px 10px; margin:8px 0;
  }
  .scores{display:flex; gap:14px; font-size:13px; margin-bottom:8px; color:var(--ink-2); flex-wrap:wrap}
  .scores b{font-size:14px; color:var(--ink)}
  .ev{font-size:13px; color:var(--ink-2); margin-bottom:8px; line-height:1.45}
  .sup{font-size:12.5px; color:var(--ink-2); margin-bottom:4px; line-height:1.4}
  .sup b{color:var(--ink)}
  .meta{font-size:12.5px; color:var(--ink-2); margin-top:6px; line-height:1.5}
  .meta .k{color:var(--ink-3)}
  footer{color:var(--ink-3); font-size:12px; text-align:center; margin:18px 0 8px; line-height:1.5}
  .empty{color:var(--ink-3); font-size:14px; padding:24px; text-align:center}
  @media (max-width:480px){

  document.getElementById('briefing').innerHTML='<div class="brief-intro"><p>A daily snapshot of '+CARDS.length+' tickers. Open a symbol for the full analysis.</p></div>'+changeHTML+'<div class="brief-grid">'
    +briefingSection('Setups on watch',watch,function(c){return c.pullbackStatus+' · '+(c.catalyst || c.stageEvidence || '');},'No healthy pullbacks or Stage 1 → 2 transitions reported.')
    +briefingSection('Worth watching',focus,function(c){return 'Trend: '+trendLabel(c.riskDial)+' · '+(c.stageEvidence || '');},'No favorable trend assessments reported.')
    +briefingSection('Needs review',caution,function(c){return 'Trend: '+trendLabel(c.riskDial)+' · '+(c.pullbackStatus || c.stageEvidence || '');},'No mixed or weak trend assessments reported.')
    +briefingSection('Data exceptions',issues,function(c){return dataException(c);},'No explicit data exceptions supplied.')+'</div>'
    +(previews.length?briefingSection('PREVIEW · Triggered setups',previews,function(c){return 'Proposed, unvalidated setup · open full analysis for its cutoff and trigger date.';},''):'')
    +'<p class="muted">Watch sections describe this snapshot, not changes since yesterday. Order follows the dataset.</p>';
  document.getElementById('briefing').querySelectorAll('[data-symbol]').forEach(function(b){b.addEventListener('click',function(){openSymbol(b.getAttribute('data-symbol'));});});
}
function setPage(v){
  pageView=v;
  ['Brief','Cards'].forEach(function(n){var active=(n==='Brief') === (v==='briefing');var b=document.getElementById('btn'+n);b.className=active?'active':'';b.setAttribute('aria-pressed',String(active));});
  document.getElementById('briefing').hidden=v!=='briefing';
  document.getElementById('cardControls').hidden=v!=='cards';
  document.getElementById('board').hidden=v!=='cards';
  if(v==='briefing')renderBriefing();else render();
}
function openSymbol(symbol){
  document.getElementById('q').value=symbol;setPage('cards');
  var panel=document.getElementById('board').querySelector('.card-details');
  if(panel){panel.open=true;panel.querySelector('summary').focus();panel.scrollIntoView({block:'nearest',behavior:'smooth'});}
}
function setView(v){
  view = v;
  var bs = document.getElementById("btnStage");
  var bc = document.getElementById("btnCat");
  bs.className = v === "stage" ? "active" : "";
  bc.className = v === "cat" ? "active" : "";
  bs.setAttribute("aria-pressed", v === "stage" ? "true" : "false");
  bc.setAttribute("aria-pressed", v === "cat" ? "true" : "false");
  render();
}
function render(){
  var q = document.getElementById("q").value.trim().toLowerCase();
  var list = CARDS.filter(function(c){
    return !q || String(c.symbol || "").toLowerCase().indexOf(q) >= 0 || String(c.label || "").toLowerCase().indexOf(q) >= 0;
  });
  var board = document.getElementById("board");
  if (!list.length){
    board.innerHTML = '<div class="empty">No cards match that filter.</div>';
    return;
  }
  var out = "";
  if (view === "stage"){
    STAGE_ORDER.forEach(function(st){
      var g = list.filter(function(c){ return c.stage === st; });
      if (!g.length) return;
      out += '<section class="group"><h2><span class="dot" style="background:' + (COLORS[st] || "#9ca3af") + '"></span>' + esc(STAGE_NAMES[st] || st) + ' (' + g.length + ')</h2><div class="cards">'
        + g.map(cardHTML).join("") + "</div></section>";
    });
    var other = list.filter(function(c){ return STAGE_ORDER.indexOf(c.stage) < 0; });
    if (other.length) out += '<section class="group"><h2>Other (' + other.length + ')</h2><div class="cards">' + other.map(cardHTML).join("") + "</div></section>";
  } else {
    CAT_ORDER.concat(list.map(function(c){return c.category;}).filter(function(cat,i,a){return CAT_ORDER.indexOf(cat)<0 && a.indexOf(cat)===i;})).forEach(function(cat){
      var g = list.filter(function(c){ return c.category === cat; });
      if (!g.length) return;
      out += '<section class="group"><h2>' + esc(cat) + ' (' + g.length + ')</h2><div class="cards">'
        + g.map(cardHTML).join("") + "</div></section>";
    });
  }
  board.innerHTML = out;
}
document.getElementById("btnStage").addEventListener("click", function(){ setView("stage"); });
document.getElementById("btnCat").addEventListener("click", function(){ setView("cat"); });
document.getElementById("q").addEventListener("input", render);
document.getElementById('btnBrief').addEventListener('click',function(){setPage('briefing');});
document.getElementById('btnCards').addEventListener('click',function(){document.getElementById('q').value='';setPage('cards');});
setPage('briefing');
</script>
</body>
</html>
